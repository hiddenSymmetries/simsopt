name: JAX Biot-Savart (CPU)

on:
  push:
    branches-ignore: [master]
  pull_request:

jobs:
  jax-biotsavart:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenblas-dev libboost-dev
          python -m pip install --upgrade pip
          python -m pip install h5py "ruff==0.15.0" "pyright==1.1.411"
      - name: Build and install the optional JAX adapter
        run: python -m pip install -v ".[jax,ALGS]" "jax==0.10.0" "jaxlib==0.10.0"
      - name: Run upstream and JAX unittest suites
        run: |
          python -m unittest discover -t tests -s tests/core -v
          python -m unittest discover -t tests -s tests/field -v
          python -m unittest discover -t tests -s tests/geo -v
          python -m unittest discover -t tests -s tests/objectives -v
      - name: Verify package import and native stage-II example
        run: |
          python -c "import simsopt_jax_adapters.field"
          python examples/2_Intermediate/stage_two_optimization.py
          python examples/2_Intermediate/stage_two_optimization.py --use-jax
      - name: Check shipped Python code
        run: |
          ruff check src/simsopt_jax src/simsopt_jax_adapters tests/unittest_jax_support.py \
            tests/core/test_backend_dtypes_reference_placement.py \
            tests/core/fresh_process \
            tests/core/test_backend_strict_jax_device_detection.py \
            tests/core/test_backend_xla_compile_preset.py \
            tests/core/test_backend_xla_gpu_fusion_autotuner.py \
            tests/core/test_coil_dof_extraction_spec_placement.py \
            tests/core/test_current_expression_extraction.py \
            tests/core/test_device_one_gradient_path.py \
            tests/core/test_kernel_numeric_helpers.py \
            tests/core/test_placement_zero.py \
            tests/core/test_state_tokens.py \
            tests/field/test_biotsavart_field_pullback.py \
            tests/field/test_biotsavart_hessian_point_chunk.py \
            tests/field/test_biotsavart_jax.py \
            tests/field/test_biotsavart_jax_cache_correctness.py \
            tests/field/test_biotsavart_jax_contract.py \
            tests/field/fresh_process \
            tests/field/test_biotsavart_jax_correctness.py \
            tests/field/test_biotsavart_jax_state_cache.py \
            tests/field/test_coil_dof_extraction_segments.py \
            tests/geo/test_curvexyzfouriersymmetries_spec_jax.py \
            tests/geo/test_native_jax_device.py \
            tests/geo/fresh_process \
            tests/geo/test_orientedcurve_jax_spec.py \
            tests/geo/test_curve_subclasses_parity.py \
            tests/core/test_runtime_host_boundary.py \
            tests/core/test_buffer_ownership.py \
            tests/core/test_host_boundary_ssot_ratchet.py \
            tests/core/test_pytree_convention.py \
            tests/field/test_stage_two_biotsavart_jax.py \
            tests/geo/test_surface_geometry_jax.py \
            examples/2_Intermediate/stage_two_optimization.py
          pyright --pythonpath "$(command -v python)"

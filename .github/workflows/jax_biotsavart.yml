name: JAX Biot-Savart (CPU)

on:
  push:
    branches-ignore: [master]
  pull_request:

jobs:
  jax-biotsavart:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenblas-dev libboost-dev
          python -m pip install --upgrade pip
          python -m pip install h5py "ruff==0.15.0" "pyright==1.1.411"
      - name: Build and install the optional JAX adapter
        run: python -m pip install -v ".[jax,ALGS]" "jax==0.10.0" "jaxlib==0.10.0"
      - name: Run upstream unittest suites without pytest
        run: |
          python -c "from importlib.metadata import distributions; assert 'pytest' not in {d.metadata['Name'].lower() for d in distributions()}"
          python -m unittest discover -t tests -s tests/core -v
          python -m unittest discover -t tests -s tests/field -v
          python -m unittest discover -t tests -s tests/geo -v
      - name: Run JAX parity and boundary tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/jax
      - name: Verify package import and stage-II examples
        run: |
          python -c "import simsopt_jax_adapters.field"
          python examples/2_Intermediate/stage_two_biotsavart_jax.py
          python examples/2_Intermediate/stage_two_optimization_jax.py
      - name: Check shipped Python code
        run: |
          ruff check src/simsopt_jax src/simsopt_jax_adapters tests/jax \
            examples/2_Intermediate/stage_two_biotsavart_jax.py \
            examples/2_Intermediate/stage_two_optimization_jax.py
          pyright --pythonpath "$(command -v python)"
